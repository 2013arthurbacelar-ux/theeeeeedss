name: Build mod jar

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build (acha a pasta do projeto sozinho)
        run: |
          S=$(find . -name settings.gradle -not -path "./.git/*" | head -1)
          echo "Projeto em: $S"
          cd "$(dirname "$S")"
          gradle build --no-daemon --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: the-stalker-jar
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: the-stalker-jar
          include-hidden-files: true
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
